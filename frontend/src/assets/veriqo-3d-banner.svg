<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="cyberGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Letter Gradients -->
    <!-- Front Face (Bright Blue to Indigo) -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Top Face (Specular Highlight) -->
    <linearGradient id="topGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <!-- Side / Extrusion Shadow -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <!-- Orange Accent Front Face (For the 'O' / Emblem) -->
    <linearGradient id="orangeFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="orangeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
    <linearGradient id="orangeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="16" stdDeviation="10" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Ambient Isometric Lighting Rays -->
  <g opacity="0.15">
    <polygon points="600,0 720,0 880,360 480,360" fill="url(#frontGrad)" />
    <circle cx="600" cy="140" r="280" fill="#0284c7" filter="url(#neonGlow)" opacity="0.25" />
  </g>

  <!-- Perspective DAG Node Network (Background Ambient) -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.2">
    <!-- Connecting Edges -->
    <line x1="80" y1="80" x2="180" y2="120" stroke-dasharray="4 4" />
    <line x1="180" y1="120" x2="120" y2="240" />
    <line x1="180" y1="120" x2="300" y2="90" />
    <line x1="1020" y1="90" x2="1120" y2="140" stroke-dasharray="4 4" />
    <line x1="1020" y1="90" x2="940" y2="210" />
    <line x1="940" y1="210" x2="1080" y2="270" />

    <!-- Isometric Diamond Nodes -->
    <polygon points="80,72 88,80 80,88 72,80" fill="#0284c7" />
    <polygon points="180,110 190,120 180,130 170,120" fill="#38bdf8" />
    <polygon points="120,230 130,240 120,250 110,240" fill="#0284c7" />
    <polygon points="300,80 310,90 300,100 290,90" fill="#f97316" />
    <polygon points="1020,80 1030,90 1020,100 1010,90" fill="#38bdf8" />
    <polygon points="1120,130 1130,140 1120,150 1110,140" fill="#0284c7" />
    <polygon points="940,200 950,210 940,220 930,210" fill="#f97316" />
    <polygon points="1080,260 1090,270 1080,280 1070,270" fill="#10b981" />
  </g>

  <!-- Top Pill Badge: MAHARASHTRA STATE INNOVATION SOCIETY / SIH 26130 -->
  <g transform="translate(600, 48)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="-216" cy="0" r="5" fill="#10b981" />
    <text x="-198" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">
      SIH 26130 • MAITRI 2.0 OVERLAY • GOV OF MAHARASHTRA
    </text>
  </g>

  <!-- 3D EXTRUDED TITLE: VERIQO -->
  <g filter="url(#shadow3D)" transform="translate(145, 90)">
    
    <!-- ══════════ LETTER 'V' ══════════ -->
    <g transform="translate(40, 0)">
      <!-- 3D Extrusion Depth Layers (Shadow/Sides) -->
      <path d="M 0,0 L 42,120 L 78,120 L 120,0 L 88,0 L 60,86 L 32,0 Z" fill="#082f49" />
      <!-- Left side extrusion -->
      <polygon points="0,0 14,14 46,134 42,120" fill="url(#sideGrad)" />
      <polygon points="120,0 134,14 102,14 88,0" fill="url(#topGrad)" opacity="0.9" />
      <polygon points="120,0 134,14 92,134 78,120" fill="url(#sideGrad)" />
      <polygon points="42,120 56,134 92,134 78,120" fill="#042033" />
      <!-- Front Face -->
      <path d="M 0,0 L 42,120 L 78,120 L 120,0 L 88,0 L 60,86 L 32,0 Z" fill="url(#frontGrad)" stroke="#60a5fa" stroke-width="1" />
      <!-- Bevel Highlights -->
      <line x1="0" y1="0" x2="32" y2="0" stroke="#bae6fd" stroke-width="2" />
      <line x1="88" y1="0" x2="120" y2="0" stroke="#bae6fd" stroke-width="2" />
    </g>

    <!-- ══════════ LETTER 'E' ══════════ -->
    <g transform="translate(200, 0)">
      <!-- Extrusion Depth -->
      <polygon points="0,0 14,14 14,134 0,120" fill="url(#sideGrad)" />
      <polygon points="0,0 90,0 104,14 14,14" fill="url(#topGrad)" />
      <polygon points="90,0 104,14 104,44 90,30" fill="url(#sideGrad)" />
      <polygon points="76,45 90,59 90,85 76,71" fill="url(#sideGrad)" />
      <polygon points="90,90 104,104 104,134 90,120" fill="url(#sideGrad)" />
      <!-- Front Face -->
      <path d="M 0,0 L 90,0 L 90,30 L 32,30 L 32,45 L 76,45 L 76,71 L 32,71 L 32,90 L 90,90 L 90,120 L 0,120 Z" fill="url(#frontGrad)" stroke="#60a5fa" stroke-width="1" />
      <line x1="0" y1="0" x2="90" y2="0" stroke="#bae6fd" stroke-width="2" />
      <line x1="32" y1="45" x2="76" y2="45" stroke="#bae6fd" stroke-width="1.5" />
      <line x1="32" y1="90" x2="90" y2="90" stroke="#bae6fd" stroke-width="1.5" />
    </g>

    <!-- ══════════ LETTER 'R' ══════════ -->
    <g transform="translate(330, 0)">
      <!-- Extrusion Depth -->
      <polygon points="0,0 14,14 14,134 0,120" fill="url(#sideGrad)" />
      <polygon points="0,0 86,0 100,14 14,14" fill="url(#topGrad)" />
      <polygon points="86,0 100,14 100,74 86,60" fill="url(#sideGrad)" />
      <polygon points="88,72 102,86 102,134 88,120" fill="url(#sideGrad)" />
      <!-- Front Face -->
      <path d="M 0,0 L 86,0 C 104,0 104,60 86,60 L 48,60 L 88,120 L 52,120 L 26,62 L 32,62 L 32,30 L 0,30 Z" fill="url(#frontGrad)" stroke="#60a5fa" stroke-width="1" />
      <path d="M 32,24 L 66,24 C 74,24 74,38 66,38 L 32,38 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <line x1="0" y1="0" x2="86" y2="0" stroke="#bae6fd" stroke-width="2" />
    </g>

    <!-- ══════════ LETTER 'I' ══════════ -->
    <g transform="translate(470, 0)">
      <!-- Extrusion Depth -->
      <polygon points="0,0 14,14 14,134 0,120" fill="url(#sideGrad)" />
      <polygon points="0,0 32,0 46,14 14,14" fill="url(#topGrad)" />
      <polygon points="32,0 46,14 46,134 32,120" fill="url(#sideGrad)" />
      <!-- Front Face -->
      <rect x="0" y="0" width="32" height="120" fill="url(#frontGrad)" stroke="#60a5fa" stroke-width="1" />
      <line x1="0" y1="0" x2="32" y2="0" stroke="#bae6fd" stroke-width="2" />
    </g>

    <!-- ══════════ LETTER 'Q' ══════════ -->
    <g transform="translate(540, 0)">
      <!-- Extrusion Depth -->
      <ellipse cx="66" cy="68" rx="52" ry="60" fill="#082f49" />
      <polygon points="76,82 90,96 114,134 100,120" fill="url(#sideGrad)" />
      <!-- Outer Front Ring -->
      <path d="M 52,0 C 82,0 104,26 104,60 C 104,80 94,98 78,108 L 102,124 L 78,124 L 62,112 C 58,113 55,114 52,114 C 22,114 0,88 0,60 C 0,26 22,0 52,0 Z" fill="url(#frontGrad)" stroke="#60a5fa" stroke-width="1" />
      <!-- Cutout Inner Hole -->
      <ellipse cx="52" cy="57" rx="22" ry="32" fill="#080e1a" stroke="#0284c7" stroke-width="1" />
      <!-- Top Highlight -->
      <path d="M 32,2 C 42,0 62,0 72,2" stroke="#bae6fd" stroke-width="2" fill="none" />
    </g>

    <!-- ══════════ LETTER 'O' (Vibrant Maharashtra Saffron Gold 3D Cube Ring) ══════════ -->
    <g transform="translate(685, 0)">
      <!-- 3D Extrusion Shadow -->
      <ellipse cx="66" cy="68" rx="52" ry="60" fill="url(#orangeSide)" />
      <polygon points="52,0 66,14 116,40 102,26" fill="url(#orangeTop)" />
      <polygon points="104,60 118,74 118,94 104,80" fill="url(#orangeSide)" />
      <!-- Outer Ring Front -->
      <ellipse cx="52" cy="60" rx="52" ry="60" fill="url(#orangeFront)" stroke="#fdba74" stroke-width="1.2" />
      <!-- Inner Cutout -->
      <ellipse cx="52" cy="60" rx="22" ry="32" fill="#080e1a" stroke="#ea580c" stroke-width="1" />
      <!-- Ashoka 24-Spoke Hologram In Center of O -->
      <circle cx="52" cy="60" r="14" stroke="#fed7aa" stroke-width="1" fill="none" opacity="0.8" />
      <circle cx="52" cy="60" r="3" fill="#ffedd5" />
      <line x1="52" y1="46" x2="52" y2="74" stroke="#fed7aa" stroke-width="0.8" opacity="0.7" />
      <line x1="38" y1="60" x2="66" y2="60" stroke="#fed7aa" stroke-width="0.8" opacity="0.7" />
      <line x1="42" y1="50" x2="62" y2="70" stroke="#fed7aa" stroke-width="0.8" opacity="0.7" />
      <line x1="42" y1="70" x2="62" y2="50" stroke="#fed7aa" stroke-width="0.8" opacity="0.7" />
      <!-- Top Rim Specular Glow -->
      <path d="M 30,2 C 42,0 62,0 74,2" stroke="#fff7ed" stroke-width="2.5" fill="none" />
    </g>

  </g>

  <!-- 3D Underline / Topological Bus Bar -->
  <g transform="translate(200, 246)">
    <!-- Metallic Track -->
    <rect x="0" y="0" width="800" height="4" rx="2" fill="#1e293b" />
    <rect x="180" y="0" width="440" height="4" rx="2" fill="url(#frontGrad)" filter="url(#neonGlow)" opacity="0.9" />
    <rect x="540" y="0" width="160" height="4" rx="2" fill="url(#orangeFront)" />

    <!-- Topological Checkpoint Nodes Along the Bus -->
    <circle cx="80" cy="2" r="6" fill="#3b82f6" stroke="#1e293b" stroke-width="2" />
    <circle cx="280" cy="2" r="6" fill="#38bdf8" stroke="#1e293b" stroke-width="2" />
    <circle cx="480" cy="2" r="7" fill="#10b981" stroke="#064e3b" stroke-width="2" />
    <circle cx="680" cy="2" r="6" fill="#f97316" stroke="#7c2d12" stroke-width="2" />
  </g>

  <!-- High-Tech Subtitle & Descriptor -->
  <g transform="translate(600, 280)" text-anchor="middle">
    <text y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3.5">
      INTELLIGENT INDUSTRIAL REGULATORY &amp; APPROVAL OS
    </text>
    <text y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1.2">
      Topological DAG Clearance Engine • 3-Level Pre-Validation • Deterministic Cross-Doc Scrutiny Desk
    </text>
  </g>

  <!-- Engineering Metrics Ticker Bar at Bottom -->
  <g transform="translate(600, 332)" text-anchor="middle">
    <text y="0" fill="#64748b" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1">
      O(V+E) TOPOLOGICAL SORT  │  27/27 VALIDATION SPECS GREEN  │  LEVENSHTEIN FUZZY MATCHER  │  CPM LONGEST-PATH SLA
    </text>
  </g>
</svg>

